# Einmalig: lädt die Tracking-, Cookie- und Formular-Skripte der alten Webflow-Seite als Vorlage ins Repo.
name: Webflow-Skripte sichern
on:
  push:
    branches: [main]
    paths: [.github/workflows/webflow-skripte.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p alt/webflow
          B="https://cdn.prod.website-files.com/662bdbeb1e60c91c67269307%2F689e5ba67671442434f3ca35"
          curl -sfL "$B%2F6ada399df5eb930a9b7e0701%2Fdmtracking-2.0.0.js" -o alt/webflow/dmtracking-2.0.0.js
          curl -sfL "$B%2F6ada399db21906a92e0bb5f1%2Fdmcookies-2.0.0.js" -o alt/webflow/dmcookies-2.0.0.js
          curl -sfL "$B%2F6ada399cfb64598369af1233%2Fdmcookiecss-1.0.0.js" -o alt/webflow/dmcookiecss-1.0.0.js
          curl -sfL "$B%2F6ae524b043ed0919fd974f35%2Fdmformmeta-1.1.0.js" -o alt/webflow/dmformmeta-1.1.0.js
          curl -sfL "https://www.deutsche-monumentum.de/" -o alt/webflow/startseite.html
          curl -sfL "https://www.deutsche-monumentum.de/impressum" -o alt/webflow/impressum.html || true
          curl -sfL "https://www.deutsche-monumentum.de/datenschutzerklarung" -o alt/webflow/datenschutzerklarung.html || true
          curl -sfL "https://www.deutsche-monumentum.de/danke" -o alt/webflow/danke.html || true
          ls -la alt/webflow
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add alt/webflow
          git commit -m "Webflow-Skripte und Rechtsseiten als Vorlage gesichert" || exit 0
          git push
