# Baut die Website bei jeder Änderung und veröffentlicht sie als Vorschau auf GitHub Pages.
# Zusätzlich alle 10 Minuten: Wurde in Sanity (CMS) etwas veröffentlicht, wird neu gebaut.
name: Vorschau veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    outputs:
      bauen: ${{ steps.stand.outputs.bauen }}
    steps:
      - id: stand
        run: |
          Q='{"query":"{\"n\": count(*[!(_id in path(\"_.**\")) && !(_type match \"sanity.*\") && !(_type match \"system.*\")]), \"t\": (*[!(_id in path(\"_.**\")) && !(_type match \"sanity.*\") && !(_type match \"system.*\")] | order(_updatedAt desc))[0]._updatedAt}","perspective":"published"}'
          NEU=$(curl -sf -X POST -H 'Content-Type: application/json' -d "$Q" https://kgw2l752.api.sanity.io/v2025-02-19/data/query/production | jq -r '.result | "\(.n)|\(.t)"' || echo "fehler")
          ALT=$(curl -sf "https://ekovac76.github.io/${{ github.event.repository.name }}/cms-stand.txt" || echo "keiner")
          echo "Sanity: $NEU / Website: $ALT"
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$NEU" != "fehler" ] && [ "$NEU" != "$ALT" ]; }; then
            echo "bauen=true" >> "$GITHUB_OUTPUT"
          else
            echo "bauen=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$NEU" > cms-stand.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cms-stand
          path: cms-stand.txt

  bauen:
    needs: pruefen
    if: needs.pruefen.outputs.bauen == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/vorschau-pfad.mjs
        env:
          BASIS: /${{ github.event.repository.name }}
      - uses: actions/download-artifact@v4
        with:
          name: cms-stand
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
