name: Sanity-Diagnose (temporär)
on:
  push:
    branches: [sanity-diagnose]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: CMS=aus npm run build && mv dist json
      - run: npm run build && mv dist cms
      - run: python3 scripts/tmp/vergleich.py
