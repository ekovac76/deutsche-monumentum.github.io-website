name: Sanity-Diagnose (temporär)
on:
  push:
    branches: [sanity-diagnose]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          grep -o '<video[^>]*>.\{0,300\}' dist/index.html | head -2
          for f in dist/*.html; do echo "$f $(wc -c < $f)"; done
          tar czf /tmp/dist.tgz dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cms
          path: /tmp/dist.tgz
